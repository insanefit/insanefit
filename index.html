<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/if-favicon.png" />
    <link rel="apple-touch-icon" href="/if-favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c40f2f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Insane Fit" />
    <meta name="format-detection" content="telephone=no" />
    <title>Insane Fit</title>
    <script>
      ;(() => {
        const params = new URLSearchParams(window.location.search)
        if (params.get('reset') !== 'cache') return

        const clearCache = async () => {
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations()
              await Promise.all(registrations.map((registration) => registration.unregister()))
            }
            if ('caches' in window) {
              const keys = await window.caches.keys()
              await Promise.all(keys.map((key) => window.caches.delete(key)))
            }
            window.localStorage?.removeItem('insanefit_auth_audience')
          } catch {
            // If browser cache APIs fail, still reload without the reset flag.
          } finally {
            window.location.replace(window.location.origin + window.location.pathname)
          }
        }

        clearCache()
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
